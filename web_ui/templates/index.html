<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagos y Mapa de Cargos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="p-4">
    <div class="container">
      <h1 class="mb-4">Pagos y Mapa de Cargos (Web)</h1>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-warning">
            {% for msg in messages %}{{ msg }}<br>{% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="/validate" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Aplicación</label>
          <select name="app_choice" id="app_choice" class="form-select" onchange="toggleForms()">
            <option value="pagos">Pagos (Perfiles, Equipos, Servicios)</option>
            <option value="mapa_transferencias">Mapa de Cargos (Transferencias)</option>
            <option value="mapa_seguridad">Mapa de Cargos (Seguridad Social)</option>
          </select>
        </div>

        <div id="pagos_fields">
          <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select">
              <option value="equipos">EQUIPOS</option>
              <option value="servicios">SERVICIOS</option>
              <option value="perfiles">PERFILES</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Informe PDF</label>
            <input class="form-control" type="file" name="pdf" accept=".pdf">
          </div>

          <div class="mb-3">
            <label class="form-label">Datos históricos (Excel)</label>
            <input class="form-control" type="file" name="excel" accept=".xlsx,.xls">
          </div>
        </div>

        <div id="transferencias_fields" style="display:none;">
          <div class="mb-3">
            <label class="form-label">Desprendibles (sube uno o más PDFs)</label>
            <input class="form-control" type="file" name="desprendibles" accept=".pdf" multiple>
          </div>
          <div class="mb-3">
            <label class="form-label">Transferencias (sube uno o más PDFs)</label>
            <input class="form-control" type="file" name="transferencias" accept=".pdf" multiple>
          </div>
        </div>

        <div id="seguridad_fields" style="display:none;">
          <div class="mb-3">
            <label class="form-label">Desprendibles (sube uno o más PDFs)</label>
            <input class="form-control" type="file" name="desprendibles" accept=".pdf" multiple>
          </div>
          <div class="mb-3">
            <label class="form-label">Seguridad social (sube uno o más PDFs)</label>
            <input class="form-control" type="file" name="seguridad" accept=".pdf" multiple>
          </div>
        </div>

        <button class="btn btn-primary">Enviar</button>
      </form>

      <script>
        function toggleForms(){
          var choice = document.getElementById('app_choice').value;
          document.getElementById('pagos_fields').style.display = choice === 'pagos' ? 'block' : 'none';
          document.getElementById('transferencias_fields').style.display = choice === 'mapa_transferencias' ? 'block' : 'none';
          document.getElementById('seguridad_fields').style.display = choice === 'mapa_seguridad' ? 'block' : 'none';
        }
      </script>
    </div>
  </body>
  </html>
